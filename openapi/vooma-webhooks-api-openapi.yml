openapi: 3.1.0
info:
  title: api Carriers Webhooks API
  version: 0.1.0
  contact: {}
servers:
- url: https://api.vooma.ai/v0
  description: Vooma API
tags:
- name: Webhooks
paths:
  /webhooks/onAppointmentUpdated:
    post:
      operationId: OnAppointmentUpdated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when an appointment is updated.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdatedEvent'
      tags:
      - Webhooks
  /webhooks/onCarrierCreated:
    post:
      operationId: OnCarrierCreated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when a carrier is created.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierCreatedEvent'
      tags:
      - Webhooks
  /webhooks/onCarrierUpdated:
    post:
      operationId: OnCarrierUpdated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when a carrier is updated.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierUpdatedEvent'
      tags:
      - Webhooks
  /webhooks/onCustomerCreated:
    post:
      operationId: OnCustomerCreated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when a customer is created.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreatedEvent'
      tags:
      - Webhooks
  /webhooks/onCustomerUpdated:
    post:
      operationId: OnCustomerUpdated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when a customer is updated.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdatedEvent'
      tags:
      - Webhooks
  /webhooks/onLocationCreated:
    post:
      operationId: OnLocationCreated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when a location is created.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreatedEvent'
      tags:
      - Webhooks
  /webhooks/onLocationUpdated:
    post:
      operationId: OnLocationUpdated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when a location is updated.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdatedEvent'
      tags:
      - Webhooks
  /webhooks/onOrderCreated:
    post:
      operationId: OnOrderCreated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when an order is created.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreatedEvent'
      tags:
      - Webhooks
  /webhooks/onOrderUpdated:
    post:
      operationId: OnOrderUpdated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when an order is updated.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdatedEvent'
      tags:
      - Webhooks
  /webhooks/onTrackingUpdateCreated:
    post:
      operationId: OnTrackingUpdateCreated
      responses:
        '200':
          description: OK
        '204':
          description: No content
      description: Sent by Vooma to your server when a new tracking update is available.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingUpdateEvent'
      tags:
      - Webhooks
components:
  schemas:
    Scale:
      properties:
        type:
          type: string
          enum:
          - SCALE
          nullable: false
      required:
      - type
      type: object
    MayHaveID_User_:
      allOf:
      - properties:
          id:
            type: string
        type: object
      - $ref: '#/components/schemas/User'
    TemperatureUnits:
      enum:
      - F
      - C
      type: string
    LocationData:
      properties:
        name:
          type: string
        contacts:
          items:
            $ref: '#/components/schemas/LocationContact'
          type: array
        hours:
          $ref: '#/components/schemas/FacilityHours'
        scheduling:
          $ref: '#/components/schemas/SchedulingDetails'
        geoCoordinates:
          $ref: '#/components/schemas/GeoCoordinates'
        address:
          $ref: '#/components/schemas/Address'
        externalIds:
          items:
            $ref: '#/components/schemas/LocationExternalIdentifier'
          type: array
      required:
      - address
      - externalIds
      type: object
    Commodity:
      $ref: '#/components/schemas/V0Cargo.Commodity'
    AppointmentData:
      properties:
        confirmationNumber:
          type: string
        timezone:
          type: string
          description: Optional timezone in [tz database](https://en.wikipedia.org/wiki/Tz_database) format e.g. "America/New_York" or "UTC".
        confirmedDatetimeUTC:
          type: string
          format: date-time
          description: Optional ISO 8601 UTC datetime in format 2025-02-19T18:00Z for the time that Vooma confirmed the appointment.
        confirmedDatetime:
          type: string
          format: date-time
          description: Optional ISO 8601 local datetime in format 2025-02-19T13:00-05:00 for the time that Vooma confirmed the appointment. This will end in +00:00 if we are missing timezone information.
        requestedDatetimeUTC:
          type: string
          format: date-time
          description: Optional ISO 8601 UTC datetime in format 2025-02-19T18:00Z for the time that Vooma requested the appointment.
        requestedDatetime:
          type: string
          format: date-time
          description: Optional ISO 8601 local datetime in format 2025-02-19T13:00-05:00 for the time that Vooma requested the appointment. This will end in +00:00 if we are missing timezone information.
        stopIndex:
          type: number
          format: double
        movementid:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatus'
      required:
      - requestedDatetimeUTC
      - requestedDatetime
      - stopIndex
      - status
      type: object
    PhoneSchedulingMethod:
      properties:
        contact:
          $ref: '#/components/schemas/LocationContact'
        type:
          type: string
          enum:
          - PHONE
          nullable: false
      required:
      - contact
      - type
      type: object
    Cargo:
      $ref: '#/components/schemas/V0Cargo.Cargo'
    LineItemType:
      enum:
      - FREIGHT_FLAT
      - FREIGHT_PER_MILE
      - FUEL
      - FUEL_FLAT
      - FUEL_PER_MILE
      - FREIGHT_PER_CONTAINER
      - CHASSIS
      - OVERWEIGHT
      - PRE_PULL
      - STORAGE
      - DETENTION
      - TMF_PIER_PASS
      - PORT_FEE
      - REDELIVERY
      - EXTRA_MILES
      - TRANSLOAD
      - ESCORT
      - EXPEDITED
      - CHASSIS_SPLIT
      - OTHER
      type: string
    HeadacheRack:
      properties:
        type:
          type: string
          enum:
          - HEADACHE_RACK
          nullable: false
      required:
      - type
      type: object
    ChainsAndBinders:
      properties:
        type:
          type: string
          enum:
          - CHAINS_AND_BINDERS
          nullable: false
      required:
      - type
      type: object
    AppointmentStatus:
      description: 'NEW: all appointments start with this status.

        REQUESTED: set after an appointment request has been made such as an email sent out or Vooma navigating a portal.

        CONFIRMED: when a facility agrees to an appointment.

        ESCALATED: if Vooma needs to ask a person for help scheduling an appointment.

        ABORTED: Vooma ending its attempt to schedule an appointment.'
      enum:
      - NEW
      - REQUESTED
      - CONFIRMED
      - ESCALATED
      - ABORTED
      type: string
    WithId_CustomerData_:
      allOf:
      - properties:
          id:
            type: string
        required:
        - id
        type: object
      - $ref: '#/components/schemas/CustomerData'
    V0Carrier.CarrierCreatedEvent:
      properties:
        carrier:
          $ref: '#/components/schemas/Carrier'
        event:
          type: string
          enum:
          - carrier.created
          nullable: false
      required:
      - carrier
      - event
      type: object
    Carrier:
      $ref: '#/components/schemas/MayHaveID_CarrierData_'
    Accessorial:
      $ref: '#/components/schemas/V0Accessorial.Accessorial'
    V0Equipment.Equipment:
      properties:
        type:
          anyOf:
          - $ref: '#/components/schemas/EquipmentType'
          - type: string
          description: Typically one of the EquipmentType enum values but subject to change
        equipmentLength:
          $ref: '#/components/schemas/Dimension'
        temperature:
          $ref: '#/components/schemas/Temperature'
        description:
          type: string
      required:
      - type
      type: object
      additionalProperties: false
    Straps:
      properties:
        numberRequired:
          type: number
          format: double
        type:
          type: string
          enum:
          - STRAPS
          nullable: false
      required:
      - type
      type: object
    Liftgate:
      properties:
        type:
          type: string
          enum:
          - LIFTGATE
          nullable: false
      required:
      - type
      type: object
    DateTimeRangeType:
      enum:
      - FACILITY_HOURS
      - APPOINTMENT
      type: string
    V0.Document:
      properties:
        url:
          type: string
        id:
          type: string
      required:
      - url
      - id
      type: object
    CoilRack:
      properties:
        type:
          type: string
          enum:
          - COIL_RACK
          nullable: false
      required:
      - type
      type: object
    V0Stop.OrderStop:
      $ref: '#/components/schemas/MayHaveID_OrderStopData_'
    Permit:
      properties:
        type:
          type: string
          enum:
          - PERMIT
          nullable: false
      required:
      - type
      type: object
    V0Reference.Reference:
      properties:
        type:
          anyOf:
          - $ref: '#/components/schemas/ReferenceType'
          - type: string
          description: 'Typically one of the ReferenceType enum values

            but subject to change'
        value:
          type: string
      required:
      - type
      - value
      type: object
      additionalProperties: false
    AppointmentUpdatedEvent:
      $ref: '#/components/schemas/V0Appointment.AppointmentUpdatedEvent'
    Appointment:
      $ref: '#/components/schemas/MayHaveID_AppointmentData_'
    HazmatDetails:
      properties:
        classifications:
          items:
            $ref: '#/components/schemas/HazmatClassification'
          type: array
        packingGroup:
          type: string
        unNumber:
          type: string
        weight:
          $ref: '#/components/schemas/Weight'
        contact:
          $ref: '#/components/schemas/HazmatContact'
      required:
      - classifications
      - contact
      type: object
    CarrierCreatedEvent:
      $ref: '#/components/schemas/V0Carrier.CarrierCreatedEvent'
    MayHaveID_LocationData_:
      allOf:
      - properties:
          id:
            type: string
        type: object
      - $ref: '#/components/schemas/LocationData'
    ChargesToCustomer:
      $ref: '#/components/schemas/V0Shipment.ChargesToCustomer'
    MayHaveID_OrderStopData_:
      allOf:
      - properties:
          id:
            type: string
        type: object
      - $ref: '#/components/schemas/OrderStopData'
    ContactData:
      anyOf:
      - $ref: '#/components/schemas/CarrierContactData'
      - $ref: '#/components/schemas/CustomerContactData'
      - $ref: '#/components/schemas/LocationContactData'
    V0ExternalId.ExternalIdentifier:
      properties:
        type:
          anyOf:
          - $ref: '#/components/schemas/ExternalIdentifierType'
          - type: string
        value:
          type: string
      required:
      - type
      - value
      type: object
      additionalProperties: false
    MayHaveID_LocationContactData_:
      allOf:
      - properties:
          id:
            type: string
        type: object
      - $ref: '#/components/schemas/LocationContactData'
    MayHaveID_Omit_LocationData.scheduling__:
      allOf:
      - properties:
          id:
            type: string
        type: object
      - $ref: '#/components/schemas/Omit_LocationData.scheduling_'
    CarrierContact:
      properties:
        contact:
          $ref: '#/components/schemas/Contact'
        type:
          type: string
          enum:
          - DRIVER
          - DISPATCH
      required:
      - contact
      - type
      type: object
    LocationCreatedEvent:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        event:
          type: string
          enum:
          - location.created
          nullable: false
      required:
      - location
      - event
      type: object
    LimitedAccess:
      properties:
        type:
          type: string
          enum:
          - LIMITED_ACCESS
          nullable: false
      required:
      - type
      type: object
    PortalSchedulingMethod:
      properties:
        details:
          $ref: '#/components/schemas/PortalSchedulingDetails'
        type:
          type: string
          enum:
          - PORTAL
          nullable: false
      required:
      - details
      - type
      type: object
    OrderCreatedEvent:
      $ref: '#/components/schemas/V0Order.OrderCreatedEvent'
    Document:
      $ref: '#/components/schemas/V0.Document'
    GeoCoordinates:
      properties:
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
      required:
      - longitude
      - latitude
      type: object
    WithId_OrderData_:
      allOf:
      - properties:
          id:
            type: string
        required:
        - id
        type: object
      - $ref: '#/components/schemas/OrderData'
    Omit_LocationData.scheduling_:
      $ref: '#/components/schemas/Pick_LocationData.Exclude_keyofLocationData.scheduling__'
      description: Construct a type with the properties of T except for those in type K.
    OrderStopData:
      allOf:
      - $ref: '#/components/schemas/CommonStopData'
      - properties:
          location:
            $ref: '#/components/schemas/OrderStopLocation'
        required:
        - location
        type: object
    DateTimeRange:
      $ref: '#/components/schemas/V0Datetime.DateTimeRange'
    DimensionUnits:
      enum:
      - IN
      - CM
      - FT
      type: string
    FreightMode:
      enum:
      - TRUCKLOAD
      - LTL
      - PARTIAL_TRUCKLOAD
      - INTERMODAL
      - DRAYAGE
      - PARCEL
      type: string
    Mileage:
      properties:
        uom:
          $ref: '#/components/schemas/MileageUnits'
        value:
          type: number
          format: double
      required:
      - uom
      - value
      type: object
    UserExternalIdentifierType:
      enum:
      - CUSTOM
      - EMAIL
      - PHONE
      - VOOMA_USERNAME
      type: string
    V0User.UserData:
      properties:
        externalIds:
          items:
            $ref: '#/components/schemas/UserExternalIdentifier'
          type: array
      required:
      - externalIds
      type: object
    Equipment:
      $ref: '#/components/schemas/V0Equipment.Equipment'
    UserExternalIdentifier:
      properties:
        type:
          anyOf:
          - $ref: '#/components/schemas/UserExternalIdentifierType'
          - type: string
          description: 'Typically one of the UserExternalIdentifierType enum values

            but subject to change'
        value:
          type: string
      required:
      - type
      - value
      type: object
      additionalProperties: false
    ExternalIdentifier:
      $ref: '#/components/schemas/V0ExternalId.ExternalIdentifier'
    MileageUnits:
      enum:
      - MI
      - KM
      type: string
    Pick_LocationData.Exclude_keyofLocationData.scheduling__:
      properties:
        externalIds:
          items:
            $ref: '#/components/schemas/LocationExternalIdentifier'
          type: array
        address:
          $ref: '#/components/schemas/Address'
        geoCoordinates:
          $ref: '#/components/schemas/GeoCoordinates'
        hours:
          $ref: '#/components/schemas/FacilityHours'
        contacts:
          items:
            $ref: '#/components/schemas/LocationContact'
          type: array
        name:
          type: string
      required:
      - externalIds
      - address
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    V0TrackingUpdate.TrackingUpdateEvent:
      properties:
        trackingUpdate:
          $ref: '#/components/schemas/TrackingUpdate'
        event:
          type: string
          enum:
          - trackingUpdate.created
          nullable: false
      required:
      - trackingUpdate
      - event
      type: object
    Amount:
      $ref: '#/components/schemas/V0Financials.Amount'
    Other:
      properties:
        description:
          type: string
        type:
          type: string
          enum:
          - OTHER
          nullable: false
      required:
      - description
      - type
      type: object
    V0Datetime.DateTimeRange:
      properties:
        startDate:
          type: string
          description: Start date in YYYY-MM-DD format
        endDate:
          type: string
          description: Optional end date in YYYY-MM-DD format
        startTime:
          type: string
          description: Optional start time in `timzone` and HH:mm:ss format.
        endTime:
          type: string
          description: Optional end time in `timezone` and HH:mm:ss format
        timezone:
          type: string
          description: Optional timezone in [tz database](https://en.wikipedia.org/wiki/Tz_database) format e.g. "America/New_York". If omitted UTC is assumed.
        type:
          $ref: '#/components/schemas/DateTimeRangeType'
      required:
      - startDate
      type: object
      additionalProperties: false
    V0Appointment.AppointmentUpdatedEvent:
      properties:
        appointment:
          $ref: '#/components/schemas/Appointment'
        event:
          type: string
          enum:
          - appointment.updated
          nullable: false
      required:
      - appointment
      - event
      type: object
    OrderStopLocation:
      $ref: '#/components/schemas/V0Location.OrderStopLocation'
    TrackingUpdateEvent:
      $ref: '#/components/schemas/V0TrackingUpdate.TrackingUpdateEvent'
    Reference:
      $ref: '#/components/schemas/V0Reference.Reference'
    Environment:
      enum:
      - TEST
      - PRODUCTION
      type: string
    MayHaveID_ContactData_:
      allOf:
      - properties:
          id:
            type: string
        type: object
      - $ref: '#/components/schemas/ContactData'
    StopType:
      enum:
      - PICKUP
      - DELIVERY
      type: string
    V0Shipment.ChargesToCustomer:
      properties:
        lineItems:
          items:
            $ref: '#/components/schemas/LineItem'
          type: array
      required:
      - lineItems
      type: object
    LocationUpdatedEvent:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        event:
          type: string
          enum:
          - location.updated
          nullable: false
      required:
      - location
      - event
      type: object
    Dunnage:
      properties:
        type:
          type: string
          enum:
          - DUNNAGE
          nullable: false
      required:
      - type
      type: object
    CustomerCreatedEvent:
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        event:
          type: string
          enum:
          - customer.created
          nullable: false
      required:
      - customer
      - event
      type: object
    LocationExternalIdentifierType:
      enum:
      - CUSTOM
      - GOOGLE_PLACES
      - TURVO
      type: string
    Order:
      $ref: '#/components/schemas/WithId_OrderData_'
    FreightModeDetails:
      $ref: '#/components/schemas/V0Mode.FreightModeDetails'
    LocationContact:
      $ref: '#/components/schemas/V0Contact.LocationContact'
    LineItem:
      properties:
        type:
          anyOf:
          - $ref: '#/components/schemas/LineItemType'
          - type: string
          description: Typically one of the LineItemType enum values but subject to change
        description:
          type: string
        amount:
          $ref: '#/components/schemas/Amount'
      required:
      - description
      - amount
      type: object
      additionalProperties: false
    MovementExternalIdentifier:
      properties:
        type:
          anyOf:
          - $ref: '#/components/schemas/MovementExternalIdentifierType'
          - type: string
        value:
          type: string
      required:
      - type
      - value
      type: object
      additionalProperties: false
    FoodGrade:
      properties:
        type:
          type: string
          enum:
          - FOOD_GRADE
          nullable: false
      required:
      - type
      type: object
    HazmatClassification:
      properties:
        qualifier:
          anyOf:
          - $ref: '#/components/schemas/HazmatClassQualifier'
          - type: string
        hazardClass:
          anyOf:
          - $ref: '#/components/schemas/HazmatClass'
          - type: string
      required:
      - qualifier
      - hazardClass
      type: object
    TrackingUpdateMovement:
      properties:
        externalIds:
          items:
            $ref: '#/components/schemas/MovementExternalIdentifier'
          type: array
        id:
          type: string
      required:
      - externalIds
      - id
      type: object
    V0Contact.Contact:
      $ref: '#/components/schemas/MayHaveID_ContactData_'
    CarrierData:
      properties:
        equipment:
          items:
            $ref: '#/components/schemas/CarrierEquipment'
          type: array
        contacts:
          items:
            $ref: '#/components/schemas/CarrierContact'
          type: array
        dotNumber:
          type: string
        mcNumber:
          type: string
        name:
          type: string
      required:
      - name
      type: object
    CarrierEquipment:
      properties:
        trailerNumber:
          type: string
        truckNumber:
          type: string
        equipment:
          $ref: '#/components/schemas/Equipment'
      required:
      - equipment
      type: object
    CustomerData:
      properties:
        contacts:
          items:
            $ref: '#/components/schemas/Contact'
          type: array
        name:
          type: string
        externalIds:
          items:
            $ref: '#/components/schemas/CustomerExternalIdentifier'
          type: array
      required:
      - name
      - externalIds
      type: object
    V0Dimensions.Dimensions:
      properties:
        height:
          $ref: '#/components/schemas/Dimension'
        width:
          $ref: '#/components/schemas/Dimension'
        length:
          $ref: '#/components/schemas/Dimension'
      type: object
    HazmatClass:
      type: string
      enum:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - '7'
      - '8'
      - '9'
      - '1.1'
      - '1.2'
      - '1.3'
      - '1.4'
      - '1.5'
      - '1.6'
      - '2.1'
      - '2.2'
      - '2.3'
      - '4.1'
      - '4.2'
      - '4.3'
      - '5.1'
      - '5.2'
      - '6.1'
      - '6.2'
    CustomerExternalIdentifierType:
      enum:
      - ALJEX
      - AVRL
      - BITFREIGHTER_RATING
      - CUSTOM
      - DAT
      - GENLOGS
      - GREENSCREENS
      - HIGHWAY
      - HOSTED_MCLEOD
      - LEGACY_MERCURYGATE
      - MCLEOD
      - MCLEOD_HOSTED
      - MERCURYGATE
      - ORDERFUL
      - SONAR
      - SOFTMODAL
      - STEDI
      - STRATEGY_LIVE
      - TABI
      - TAI
      - TEST
