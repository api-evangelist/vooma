aid: vooma
name: Vooma
description: >-
  Vooma builds AI agents for the freight industry, automating the back office
  of freight brokers and carriers. Its agents quote loads from email, build
  orders in the TMS, schedule facility appointments, cover loads with carriers,
  and track shipments end to end. The Vooma Public API (api.vooma.ai/v0) lets
  enterprise customers integrate their own TMS, exposing quotes, shipments,
  movements, carriers, customers, locations, contacts, and tracking status,
  with webhook events for orders, carriers, customers, locations, appointments,
  and tracking updates.
